<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .b-grey { fill: #7E8287; }
      .b-blue-mid { fill: #1D6FB8; }
      .b-blue-dark { fill: #104373; }
      .house-blue { fill: #1D6FB8; }
      .house-grey { fill: #7E8287; }
      .window { fill: #ffffff; }
      .brand-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #1D6FB8; font-size: 17px; letter-spacing: -0.02em; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100" height="100" rx="16"/>

  <!-- Main Tall Center Building (Grey) -->
  <path class="b-grey" d="M40 14 L58 14 L58 58 L40 58 Z"/>
  <rect class="window" x="43" y="18" width="4" height="4" rx="0.5"/>
  <rect class="window" x="51" y="18" width="4" height="4" rx="0.5"/>
  <rect class="window" x="43" y="25" width="4" height="4" rx="0.5"/>
  <rect class="window" x="51" y="25" width="4" height="4" rx="0.5"/>
  <rect class="window" x="43" y="32" width="4" height="4" rx="0.5"/>
  <rect class="window" x="51" y="32" width="4" height="4" rx="0.5"/>

  <!-- Left Skyscraper (Blue) -->
  <path class="b-blue-mid" d="M30 26 L44 26 L44 58 L30 58 Z"/>
  <line x1="33" y1="31" x2="41" y2="31" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="33" y1="37" x2="41" y2="37" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="33" y1="43" x2="41" y2="43" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Right Building (Dark Blue) -->
  <path class="b-blue-dark" d="M54 33 L68 33 L68 60 L54 60 Z"/>
  <line x1="57" y1="38" x2="65" y2="38" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="57" y1="44" x2="65" y2="44" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="57" y1="50" x2="65" y2="50" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Front Left House (Blue Roof) -->
  <path class="house-blue" d="M22 60 L46 46 L58 54 L58 66 L22 66 Z"/>
  <path d="M22 60 L46 46 L58 54" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <circle class="window" cx="33" cy="59" r="2.5"/>

  <!-- Front Right House (Grey Roof) -->
  <path class="house-grey" d="M38 70 L62 56 L78 65 L78 76 L38 76 Z"/>
  <path d="M38 70 L62 56 L78 65" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <rect class="window" x="64" y="66" width="5" height="5" rx="1"/>

  <!-- Brand Text -->
  <text class="brand-text" x="50" y="93" text-anchor="middle">Buildsy</text>
</svg>
